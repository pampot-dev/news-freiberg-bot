[project]
name = "news-freiberg-bot"
version = "0.1.0"
description = "Telegram bot that translates freiberg.de news into Russian and publishes them"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "aiosqlite>=0.20",
    "deepl>=1.19",
    "httpx>=0.27",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "selectolax>=0.3.21",
    # zoneinfo needs it in slim Docker images
    "tzdata",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
