services:
  bot:
    build: .
    image: news-freiberg-bot
    env_file: .env
    environment:
      DB_PATH: /app/data/bot.db
    volumes:
      - bot-data:/app/data
      - ./glossary.yaml:/app/glossary.yaml:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:
